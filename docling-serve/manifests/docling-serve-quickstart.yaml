# Minimal CPU-only docling-serve deployment for OpenShift.
# Adapted from the upstream reference example at
# https://github.com/docling-project/docling-serve/blob/main/docs/deploy-examples/docling-serve-simple.yaml
#
# Apply with:
#   oc new-project docling
#   oc apply -f docling-serve-quickstart.yaml
#   oc expose svc/docling-serve
#   oc get route docling-serve
---
apiVersion: v1
kind: Service
metadata:
  name: docling-serve
  labels:
    app: docling-serve
    component: docling-serve-api
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: docling-serve
    component: docling-serve-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  labels:
    app: docling-serve
    component: docling-serve-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
      component: docling-serve-api
  template:
    metadata:
      labels:
        app: docling-serve
        component: docling-serve-api
    spec:
      restartPolicy: Always
      containers:
        - name: api
          image: "ghcr.io/docling-project/docling-serve-cpu:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "true"
            # docling-serve's uvicorn layer listens on 5001 by default;
            # UVICORN_ (not DOCLING_SERVE_) is the prefix uvicorn itself
            # reads, so this repo's 8080 standard has to go through it.
            - name: UVICORN_PORT
              value: "8080"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: docling-serve
  labels:
    app: docling-serve
    component: docling-serve-api
spec:
  to:
    kind: Service
    name: docling-serve
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
